---
# Scenario: Delete all existing EDA process logs, including prior audit markers.
# The API leaves one new audit marker per process that lost rows.
- name: Purge all existing EDA logs
  hosts: localhost
  gather_facts: false
  vars:
    aap_hostname: "https://example.com"
    aap_validate_certs: true

  tasks:
    - name: Queue global log purge
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/logs/purge/"
        method: POST
        status_code: 202
        body_format: json
        body:
          purge-all-logs: true
          audit_trail: true
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: purge_response

    - name: Report queued purge job
      ansible.builtin.debug:
        msg: "EDA log purge queued. Job ID: {{ purge_response.json.job_id }}"
