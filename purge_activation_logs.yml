---
# Scenario: Global retention purge. Queue deletion of logs older than the
# configured number of days across all activations and orphaned processes.
- name: Purge EDA logs older than a retention period
  hosts: localhost
  gather_facts: false
  vars:
    aap_hostname: "https://example.com"
    aap_validate_certs: true
    retention_days: 1

  tasks:
    - name: Queue global log purge
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/logs/purge/"
        method: POST
        status_code: 202
        body_format: json
        body:
          retention_duration: "P{{ retention_days }}D"
          audit_trail: true
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: purge_response

    - name: Report queued purge job
      ansible.builtin.debug:
        msg: "EDA log purge queued. Job ID: {{ purge_response.json.job_id }}"
