---
# Scenario: Purge logs older than one second for one existing activation ID.
# Other activations and orphaned processes are outside this purge's scope.
- name: Purge logs for one EDA activation ID
  hosts: localhost
  gather_facts: false
  vars:
    aap_hostname: "https://example.com"
    aap_validate_certs: true
    activation_id: 123  # Replace with an existing activation ID.

  tasks:
    - name: Queue activation log purge
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/logs/purge/"
        method: POST
        status_code: 202
        body_format: json
        body:
          retention_duration: "PT1S"
          activation_ids:
            - "{{ activation_id | int }}"
          audit_trail: true
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: purge_response
      no_log: true

    - name: Report queued purge job
      ansible.builtin.debug:
        msg: "EDA activation log purge queued. Job ID: {{ purge_response.json.job_id }}"
